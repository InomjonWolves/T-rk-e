name: Audio namunalar

# Google Cloud TTS: barcha tr-TR ovozlarida bir xil so'z va gaplar (ovoz tanlash uchun).
# Natija audio-samples branch'ida (samples/*.mp3, index.json). Secret: GOOGLE_TTS_KEY.
on:
  push:
    branches: [main]
    paths: [".github/workflows/audio-samples.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
    steps:
      - name: Kalit tekshiruvi
        if: env.GOOGLE_TTS_KEY == ''
        run: echo "GOOGLE_TTS_KEY sozlanmagan — o'tkazib yuborildi."
      - uses: actions/checkout@v5
        if: env.GOOGLE_TTS_KEY != ''
      - uses: actions/setup-node@v5
        if: env.GOOGLE_TTS_KEY != ''
        with:
          node-version: 22
      - name: Namunalar
        if: env.GOOGLE_TTS_KEY != ''
        run: node tools/audio-gen.js --samples
      - name: audio-samples branch'iga yozish
        if: env.GOOGLE_TTS_KEY != ''
        run: |
          cd samples
          git init -q -b audio-samples && git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Google TTS namunalar ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" audio-samples
