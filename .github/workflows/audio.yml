name: Audio

# Saytdagi barcha turkcha so'z va gaplarning audiosi (Microsoft Edge neyron ovozlari — edge-tts, kalitsiz; yoki Google Cloud TTS) — tools/audio-gen.js.
# Faqat yangi yoki o'zgargan matnlar ovozlanadi; natija audio/ papkasiga commit qilinadi va sayt qayta joylanadi.
# Ovoz va provayder: tools/audio-voice.json ("provider": "edge" — kalit kerak emas; aks holda secret GOOGLE_TTS_KEY).
on:
  push:
    branches: [main]
    paths:
      - "tools/audio-voice.json"
      - "tools/audio-gen.js"
      - "tools/audio-edge.py"
      - "tools/audio-texts.js"
      - "content.js"
      - "lugat.js"
      - "grammar.js"
      - "grammar-ex.js"
      - "course.js"
      - "guide.js"
      - "oqish.js"
      - "placement.js"
  workflow_dispatch:

concurrency:
  group: audio
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright (matnlar ro'yxati ilovadan olinadi)
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: edge-tts
        run: pip install -q edge-tts
      - name: Audio yaratish
        run: node tools/audio-gen.js
      - name: Commit va saytni qayta joylash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A audio
          if git diff --cached --quiet; then echo "Audio o'zgarmadi"; exit 0; fi
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Audio yangilandi ($(git diff --cached --name-only | wc -l) fayl)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          gh workflow run firebase-hosting.yml --ref main
          # The Android app carries every recording inside (tools/native-www.js): build it again with the new audio
          gh workflow run native.yml --ref main
