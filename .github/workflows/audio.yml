name: Audio

# Saytdagi turkcha matnlarning audiosi — Gemini TTS (Google AI Studio'ning bepul kaliti, tools/audio-gen.js): hikoya va
# dialoglarning har bir gapi o'z qahramonining ovozida, keyin yozuvi yo'q yangi matnlar. Secret: GEMINI_API_KEY (bo'lmasa
# audio o'zgarmaydi). Bepul tarifning kunlik limiti bor: limit tugasa ish jim to'xtaydi va har kungi jadval bilan ertasi
# kuni davom etadi; 40 daqiqadan keyin natijani commit qiladi va matn qolgan bo'lsa o'zini yana ishga tushiradi.
on:
  push:
    branches: [main]
    paths:
      - "tools/audio-voice.json"
      - "tools/audio-gen.js"
      - "tools/audio-texts.js"
      - "content.js"
      - "lugat.js"
      - "grammar.js"
      - "grammar-ex.js"
      - "course.js"
      - "guide.js"
      - "oqish.js"
      - "placement.js"
      - "hikoya.js"
  workflow_dispatch:
  # Every day after the free tier's daily reset (midnight Pacific time)
  schedule:
    - cron: "23 9 * * *"

concurrency:
  group: audio
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Kalit yo'q
        if: env.GEMINI_API_KEY == ''
        run: echo "GEMINI_API_KEY sozlanmagan — audio o'zgarmadi."
      - uses: actions/checkout@v5
        if: env.GEMINI_API_KEY != ''
        with:
          ref: main
      - uses: actions/setup-node@v5
        if: env.GEMINI_API_KEY != ''
        with:
          node-version: 22
      - name: Playwright (matnlar ro'yxati ilovadan olinadi) va ffmpeg
        if: env.GEMINI_API_KEY != ''
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Audio yozish (Gemini TTS)
        id: gen
        if: env.GEMINI_API_KEY != ''
        run: node tools/audio-gen.js
        env:
          AUDIO_DEBUG_DIR: debug
      # Recordings that could not be cut into lines, for a look (audio-debug branch; not on the site)
      - name: Boʻlinmagan yozuvlar (audio-debug)
        if: always() && hashFiles('debug/index.txt') != ''
        run: |
          cd debug
          git init -q -b audio-debug && git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Bo'linmagan yozuvlar ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" audio-debug
      # Progress is kept even when the run stopped (the day's limit, a wrong key)
      - name: Commit va saytni qayta joylash
        id: commit
        if: always() && env.GEMINI_API_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A audio
          if git diff --cached --quiet; then echo "Audio o'zgarmadi"; exit 0; fi
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Audio yangilandi ($(git diff --cached --name-only | wc -l) fayl)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          gh workflow run firebase-hosting.yml --ref main
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Davomi (matn qolgan bo'lsa)
        if: steps.gen.outputs.left != '' && steps.gen.outputs.left != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run audio.yml --ref main
      # The day's recording is over (nothing left for a next run today): the app is built again and its APK put on
      # GitHub (Releases «ilova-latest») with the new list of recordings and sent to the admin's chat with the bot
      # (TELEGRAM_ADMIN_ID) — nobody has to start anything
      - name: Ilovani qayta yig'ish (APK) va Telegramga yuborish
        if: always() && steps.commit.outputs.changed == '1' && (steps.gen.outputs.left == '' || steps.gen.outputs.left == '0')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MADE: ${{ steps.gen.outputs.made }}
          REST: ${{ steps.gen.outputs.rest }}
        run: |
          NOTE="Yangi ovozli yozuvlar qoʻshildi"
          if [ -n "$MADE" ] && [ "$MADE" != "0" ]; then NOTE="Yangi ovozli yozuvlar: $MADE ta gap"; fi
          if [ -n "$REST" ] && [ "$REST" != "0" ]; then NOTE="$NOTE (yana $REST ta navbatda)"; fi
          gh workflow run native.yml --ref main -f notify=true -f note="$NOTE"
