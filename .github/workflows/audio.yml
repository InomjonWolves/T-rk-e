name: Audio

# Saytdagi barcha turkcha so'z va gaplarning audiosi — Azure AI Speech, rasmiy REST API kalit bilan (tools/audio-gen.js).
# Secret'lar: AZURE_SPEECH_KEY va AZURE_SPEECH_REGION (bo'lmasa audio o'zgarmaydi). Bepul tarif daqiqasiga 20 so'rov
# qabul qiladi: bitta ishga tushirish ~40 daqiqa ishlaydi, natijani commit qiladi va matn qolgan bo'lsa o'zini yana
# ishga tushiradi. Fayllar saytda turadi (Firebase Hosting); Android ilova ularni saytdan bosilganda yuklaydi.
on:
  push:
    branches: [main]
    paths:
      - "tools/audio-voice.json"
      - "tools/audio-gen.js"
      - "tools/audio-texts.js"
      - "content.js"
      - "lugat.js"
      - "grammar.js"
      - "grammar-ex.js"
      - "course.js"
      - "guide.js"
      - "oqish.js"
      - "placement.js"
      - "hikoya.js"
  workflow_dispatch:

concurrency:
  group: audio
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
    steps:
      - name: Kalit yo'q
        if: env.AZURE_SPEECH_KEY == '' || env.AZURE_SPEECH_REGION == ''
        run: echo "AZURE_SPEECH_KEY / AZURE_SPEECH_REGION sozlanmagan — audio o'zgarmadi."
      - uses: actions/checkout@v5
        if: env.AZURE_SPEECH_KEY != '' && env.AZURE_SPEECH_REGION != ''
        with:
          ref: main
      - uses: actions/setup-node@v5
        if: env.AZURE_SPEECH_KEY != '' && env.AZURE_SPEECH_REGION != ''
        with:
          node-version: 22
      - name: Playwright (matnlar ro'yxati ilovadan olinadi)
        if: env.AZURE_SPEECH_KEY != '' && env.AZURE_SPEECH_REGION != ''
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Audio yozish (Azure)
        id: gen
        if: env.AZURE_SPEECH_KEY != '' && env.AZURE_SPEECH_REGION != ''
        run: node tools/audio-gen.js
      # Progress is kept even when Azure stopped the run (quota, a wrong key)
      - name: Commit va saytni qayta joylash
        if: always() && env.AZURE_SPEECH_KEY != '' && env.AZURE_SPEECH_REGION != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A audio
          if git diff --cached --quiet; then echo "Audio o'zgarmadi"; exit 0; fi
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Audio yangilandi ($(git diff --cached --name-only | wc -l) fayl)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          gh workflow run firebase-hosting.yml --ref main
      - name: Davomi (matn qolgan bo'lsa)
        if: steps.gen.outputs.left != '' && steps.gen.outputs.left != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run audio.yml --ref main
