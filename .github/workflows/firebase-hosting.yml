name: Firebase Hosting

# main ga har push'da: testlar oʻtsa, sayt Firebase Hosting'ga (firebase.json dagi "site") joylanadi.
# FIREBASE_SERVICE_ACCOUNT kaliti hali qoʻshilmagan boʻlsa, joylash xatosiz oʻtkazib yuboriladi.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Eng kam ruxsat: kodni oʻqish; deploy action PR izohi va tekshiruv natijasi uchun
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Kalit tekshiruvi
        if: env.HAS_KEY != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT kaliti sozlanmagan — Firebase'ga joylash oʻtkazib yuborildi."
      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
      - name: Testlar
        if: env.HAS_KEY == 'true'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test
      - name: Kodni siqish va siqilgan nusxani tekshirish
        if: env.HAS_KEY == 'true'
        run: |
          # Repo kodi oʻqiladigan holda qoladi; saytga siqilgan nusxa ketadi. sw.js CACHE = commit (har joylash — yangi versiya)
          node tools/minify.js . --version "${GITHUB_SHA::8}"
          # Ilovaning ishlashini tekshiradigan testlar siqilgan kod bilan (manba matnini oʻqiydigan testlar emas)
          node --test --test-concurrency=2 tests/pages.test.js tests/practice.test.js tests/xp.test.js tests/reading.test.js tests/placement.test.js tests/achievements.test.js tests/lugat.test.js tests/layout.test.js tests/checks.test.js tests/groups.test.js tests/auth.test.js
      - name: Firebase Hosting'ga joylash
        if: env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: t-rk-e
