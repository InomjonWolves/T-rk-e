# Mustaqil Android ilova (Capacitor): sayt fayllari ilova ichiga joylanadi, internetsiz ochiladi, brauzerga bog'liq emas.
# Natija: turkce-yol-ilova.apk (telefonga o'rnatib sinash — Releases → ilova-latest) va turkce-yol-ilova.aab (Google Play).
# Imzo — birinchi ilova bilan bir xil yuklash kaliti (android/upload-key.jks.enc, parol: secret ANDROID_KEY_PASS),
# paket nomi ham bir xil (uz.turkceyol.app) — shuning uchun bu ilova eski ilovaning ustiga yangilanish bo'lib o'rnatiladi.
name: Ilova (Capacitor)

on:
  workflow_dispatch:
    inputs:
      # audio.yml after the day's recording: the new APK also goes to the admin's chat with @TurkceYolBot
      notify:
        description: "APK ni Telegram botga yuborish (TELEGRAM_ADMIN_ID)"
        type: boolean
        default: false
      note:
        description: "Telegram xabaridagi izoh (nima yangi)"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "native/**"
      - "tools/native-www.js"
      - ".github/workflows/native.yml"
      - "*.js"
      - "js/**"
      - "*.css"
      - "*.html"
      - "fonts/**"

permissions:
  contents: write

concurrency:
  group: native
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Capacitor va Firebase SDK
        working-directory: native
        run: npm ci --no-audit --no-fund
      - name: Sayt fayllarini ilovaga joylash
        run: |
          node tools/native-www.js
          cd native && npx cap sync android
      - name: google-services.json (Google bilan kirish)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::warning::GOOGLE_SERVICES_JSON secret yo'q — ilovada Google bilan kirish ishlamaydi"; exit 0; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > native/android/app/google-services.json
          node tools/google-services-check.js
      - name: Yuklash kaliti
        id: key
        run: |
          if [ "${#ANDROID_KEY_PASS}" -lt 12 ] || [ ! -f android/upload-key.jks.enc ]; then
            echo "::warning::ANDROID_KEY_PASS yoki android/upload-key.jks.enc yo'q — faqat sinov (debug) APK yig'iladi"
            echo "ok=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/upload-key.jks.enc -out native/android/upload-key.jks -pass env:ANDROID_KEY_PASS
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - name: Yig'ish
        working-directory: native/android
        run: |
          chmod +x gradlew
          mkdir -p ../../out
          if [ "${{ steps.key.outputs.ok }}" = "1" ]; then
            export ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
            ./gradlew --no-daemon -q assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk ../../out/turkce-yol-ilova.apk
            cp app/build/outputs/bundle/release/app-release.aab ../../out/turkce-yol-ilova.aab
            # v2/v3 imzo: apksigner bilan tekshiriladi (keytool faqat eski v1 imzoni o'qiydi)
            APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
            "$APKSIGNER" verify --print-certs ../../out/turkce-yol-ilova.apk | grep -E "SHA-1|SHA-256" || echo "::warning::imzo tekshiruvi o'qilmadi"
          else
            unset ANDROID_KEY_PASS
            ./gradlew --no-daemon -q assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../../out/turkce-yol-ilova-debug.apk
          fi
          ls -la ../../out
      - uses: actions/upload-artifact@v4
        with:
          name: turkce-yol-ilova
          path: out/
          retention-days: 30
      - name: Sinov uchun APK (Releases → ilova-latest)
        if: steps.key.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ilova-latest -y --cleanup-tag 2>/dev/null || true
          gh release create ilova-latest out/turkce-yol-ilova.apk out/turkce-yol-ilova.aab --prerelease --target "$GITHUB_SHA" \
            --title "Türkçe Yoʻl — mustaqil ilova (sinov, $((1000 + GITHUB_RUN_NUMBER)))" \
            --notes "Brauzerga bog'liq bo'lmagan ilova (Capacitor). APK — telefonga o'rnatib sinash uchun (eski ilova ustiga yangilanadi). AAB — Google Play Console'ga yuklash uchun."
      # The phone gets the new version in Telegram (private chat with the bot, not the channel). A failed send does not
      # undo the release — the APK is on GitHub anyway
      - name: Telegram botga yuborish
        if: steps.key.outputs.ok == '1' && inputs.notify
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          APK_NOTE: ${{ inputs.note }}
          APK_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/ilova-latest
        run: |
          export APK_VERSION=$((1000 + GITHUB_RUN_NUMBER))
          node tools/telegram-apk.js out/turkce-yol-ilova.apk
