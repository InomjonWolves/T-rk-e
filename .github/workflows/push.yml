name: Eslatmalar

# Har soat: shu soatga eslatma qoʻygan va bugun hali mashq qilmagan foydalanuvchilarga bildirishnoma (tools/push.js).
# Kalit: PUSH_SERVICE_ACCOUNT (yoki FIREBASE_SERVICE_ACCOUNT) — rollari "Cloud Datastore User" va "Firebase Cloud Messaging API Admin".
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SA: ${{ secrets.PUSH_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Eslatmalarni yuborish
        run: node tools/push.js
