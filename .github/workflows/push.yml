name: Eslatmalar

# Har soat: eslatma soati kelgan, bugun hali mashq qilmagan va bugun eslatma olmagan foydalanuvchilarga bildirishnoma
# (tools/push.js). GitHub jadvali soatlab kechikadi — tashqi rejalashtiruvchi (cron-job.org) har soat workflow_dispatch'ni
# chaqiradi; kechikkan yoki ikkinchi ishga tushirish zarar qilmaydi: har kim kuniga bitta eslatma oladi (push/{uid}.sent).
# Kalit: PUSH_SERVICE_ACCOUNT (alohida secret; boʻlmasa hech narsa qilinmaydi) — service account rollari "Cloud Datastore User" va "Firebase Cloud Messaging API Admin".
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SA: ${{ secrets.PUSH_SERVICE_ACCOUNT }}
    steps:
      - name: Kalit tekshiruvi
        if: env.SA == ''
        run: echo "PUSH_SERVICE_ACCOUNT sozlanmagan — eslatmalar oʻtkazib yuborildi."
      - uses: actions/checkout@v5
        if: env.SA != ''
        with:
          sparse-checkout: tools
      - uses: actions/setup-node@v5
        if: env.SA != ''
        with:
          node-version: 22
      - name: Eslatmalarni yuborish
        if: env.SA != ''
        run: node tools/push.js
