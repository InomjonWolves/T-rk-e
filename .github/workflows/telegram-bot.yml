name: Telegram bot

# Zaxira yo'l (faqat qo'lda): xabarlarni getUpdates bilan o'qib javob beradi — tools/telegram-bot.js.
# Asosiy yo'l — webhook va Vercel ("Telegram bot (Vercel)" workflow'i), bot darhol javob beradi.
# Webhook yoqilgan bo'lsa Telegram getUpdates'ni rad etadi — bu workflow faqat webhook o'chirilganda kerak.
on:
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Kalit tekshiruvi
        if: env.TELEGRAM_BOT_TOKEN == ''
        run: echo "TELEGRAM_BOT_TOKEN sozlanmagan — o'tkazib yuborildi."
      - uses: actions/checkout@v5
        if: env.TELEGRAM_BOT_TOKEN != ''
        with:
          sparse-checkout: |
            tools
            content.js
            lugat.js
            grammar-ex.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        if: env.TELEGRAM_BOT_TOKEN != ''
        with:
          node-version: 22
      - name: Javob berish
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: node tools/telegram-bot.js
