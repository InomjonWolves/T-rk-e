name: Telegram

# Har kuni ertalab Telegram kanalga "Kunning so'zi" (tools/telegram.js), shanba kunlari — haftalik viktorina ham (tools/quiz.js).
# Secret'lar: TELEGRAM_BOT_TOKEN (@BotFather, bot kanalda admin) va TELEGRAM_CHAT_ID (@kanal_nomi). Boʻlmasa jim oʻtadi.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      quiz:
        description: "Haftalik viktorinani ham yuborish"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      QUIZ: ${{ inputs.quiz && '1' || '' }}
    steps:
      - name: Kalit tekshiruvi
        if: env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == ''
        run: echo "Telegram secret'lari sozlanmagan — post oʻtkazib yuborildi."
      - uses: actions/checkout@v5
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
      - uses: actions/setup-node@v5
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        with:
          node-version: 22
      - name: Kunning so'zi
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: node tools/telegram.js
