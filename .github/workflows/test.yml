name: Testlar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright oʻrnatish
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Testlarni ishga tushirish
        run: npm test
