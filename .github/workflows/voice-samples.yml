name: Ovoz namunalari

# Gemini TTS bilan bir nechta ovozda namunalar — saytdagi hozirgi ovozlar bilan solishtirish uchun (tools/gemini-samples.js).
# Secret: GEMINI_API_KEY (Google AI Studio'ning bepul kaliti). Natija ovoz-namuna branch'ida (wav fayllar va index.json).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/voice-samples.yml"
      - "tools/gemini-samples.js"

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Kalit yo'q
        if: env.GEMINI_API_KEY == ''
        run: echo "GEMINI_API_KEY sozlanmagan — namunalar yozilmadi."
      - uses: actions/checkout@v5
        if: env.GEMINI_API_KEY != ''
      - uses: actions/setup-node@v5
        if: env.GEMINI_API_KEY != ''
        with:
          node-version: 22
      - name: Namunalar (Gemini TTS)
        if: env.GEMINI_API_KEY != ''
        run: node tools/gemini-samples.js out
      - name: ovoz-namuna branch'iga yozish
        if: always() && env.GEMINI_API_KEY != ''
        run: |
          cd out
          git init -q -b ovoz-namuna && git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Gemini TTS namunalar ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ovoz-namuna
