<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Türkçe Yoʻl</title>
<meta name="description" content="Oʻzbeklar uchun turk tili: 36 ta dars, 539 ta soʻz, A1–B2 grammatika qoʻllanmasi, takrorlash tizimi, reyting va statistika. Bepul, telefonda qulay.">
<meta name="theme-color" content="#edf1fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0c1e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Türkçe Yoʻl">
<meta property="og:title" content="Türkçe Yoʻl — turk tilini oʻrganing">
<meta property="og:description" content="Oʻzbeklar uchun turk tili: darslar, grammatika, takrorlash, reyting.">
<meta property="og:image" content="icon-512.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Apply the saved theme before first paint
  try { const t = localStorage.getItem("ty-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>

<section class="auth" id="auth" hidden aria-label="Kirish">
  <div class="auth-hero">
    <div class="float" id="auth-mascot"></div>
    <h1>Türkçe Yoʻl</h1>
    <p>Turk tilini oʻzbek tilida, kuniga 10 daqiqada oʻrganing.</p>
  </div>
  <div class="auth-card glass blur">
    <div class="auth-loading" id="auth-loading"><div><div class="spin"></div>Yuklanmoqda…</div></div>
    <div id="auth-body" hidden style="display:none;flex-direction:column;gap:14px">
      <div class="seg glass" role="tablist" aria-label="Kirish yoki roʻyxatdan oʻtish">
        <button role="tab" id="tab-login" data-act="auth-tab" data-t="login" aria-selected="true">Kirish</button>
        <button role="tab" id="tab-signup" data-act="auth-tab" data-t="signup" aria-selected="false">Roʻyxatdan oʻtish</button>
      </div>
      <form id="auth-form" novalidate>
        <div class="field" id="f-name" hidden><label for="a-name">Ismingiz</label><input id="a-name" autocomplete="name" placeholder="Masalan, Aziza"></div>
        <div class="field"><label for="a-email">Elektron pochta</label><input id="a-email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="siz@gmail.com"></div>
        <div class="field"><label for="a-pass">Parol</label><input id="a-pass" type="password" autocomplete="current-password" placeholder="Kamida 6 ta belgi"></div>
        <div class="field" id="f-pass2" hidden><label for="a-pass2">Parolni takrorlang</label><input id="a-pass2" type="password" autocomplete="new-password"></div>
        <p class="auth-err" id="auth-err" role="alert"></p>
        <button class="btn btn-grad btn-block" id="auth-submit" type="submit">Kirish</button>
      </form>
      <button class="link" id="auth-reset" data-act="auth-reset" style="align-self:center">Parolni unutdingizmi?</button>
      <div class="or">yoki</div>
      <button class="btn btn-ghost btn-block" data-act="auth-google"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.2-2.1 3.5-5.1 3.5-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6h-4a12 12 0 0 0 0 10.8z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"/></svg>Google bilan kirish</button>
      <p class="auth-small">Roʻyxatdan oʻtib, <a href="privacy.html">maxfiylik siyosati</a>ga rozilik bildirasiz.</p>
    </div>
  </div>
</section>

<main class="app" id="app"></main>

<nav class="nav blur" aria-label="Asosiy menyu">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Asosiy</span></a>
  <a href="#lessons" data-tab="lessons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5C4 4 7 4 12 6c5-2 8-2 10-.5V19c-2-1.5-5-1.5-10 .5-5-2-8-2-10-.5z"/><path d="M12 6v13.5"/></svg><span>Darslar</span></a>
  <a href="#practice" data-tab="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="15" rx="3"/><path d="M8 3h10a3 3 0 0 1 3 3v11"/></svg><span>Mashq</span></a>
  <a href="#rank" data-tab="rank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg><span>Reyting</span></a>
  <a href="#profile" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Profil</span></a>
</nav>

<div class="session" id="session" hidden role="dialog" aria-modal="true" aria-label="Mashq">
  <div class="session-inner">
    <div class="session-top">
      <button class="icon-btn" data-act="close-session" aria-label="Mashqni yopish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="bar"><i id="s-bar" style="width:0%"></i></div>
      <div class="s-cat" id="s-cat"></div>
      <div class="session-count" id="s-count">0/10</div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="session-foot" id="s-foot"></div>
  </div>
</div>

<div class="sheet-wrap" id="sheet" hidden data-act="sheet-close"><div class="sheet" id="sheet-body" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="content.js"></script>
<script src="grammar.js"></script>
<script src="book.js"></script>
<script src="cat.js"></script>
<script src="app.js"></script>
</body>
</html>
